name: aarsh-remote-ci
on:
  push: { paths: ["aarsh-remote/**", ".github/workflows/aarsh-remote-ci.yml"] }
  pull_request: { paths: ["aarsh-remote/**"] }
defaults: { run: { working-directory: aarsh-remote } }
jobs:
  # Backend + protocol + the cross-language end-to-end (real .NET agent <-> real backend <-> real PostgreSQL)
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: aarsh-remote/pnpm-lock.yaml }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: dotnet build apps/desktop-agent/src/AarshRemote.Agent -c Debug
      - run: pnpm test
        env: { AGENT_DLL: "${{ github.workspace }}/aarsh-remote/apps/desktop-agent/src/AarshRemote.Agent/bin/Debug/net8.0/AarshRemote.Agent.dll" }
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  agent-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test apps/desktop-agent/AarshRemote.sln
      - run: dotnet list apps/desktop-agent/src/AarshRemote.Agent package --vulnerable --include-transitive

  # Windows-only code (DPAPI, Windows APIs, tray) must at least compile and the unit tests must pass on Windows.
  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test apps/desktop-agent/AarshRemote.sln
      - run: dotnet build apps/desktop-agent/src/AarshRemote.Tray -c Release
      - run: dotnet publish apps/desktop-agent/src/AarshRemote.Agent -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with: { name: AarshRemote.Agent-win-x64, path: aarsh-remote/publish/AarshRemote.Agent.exe }
